# ── Render.com deployment config ──────────────────────────────────────────────
# Docs: https://render.com/docs/blueprint-spec
# Deploy: connect repo on render.com → "New Blueprint"

services:

  # Backend (FastAPI)
  - type: web
    name: quizforge-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: quizforge-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "30"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: OPENROUTER_API_KEY
        sync: false          # Set manually in Render dashboard
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.1-8b-instruct:free
      - key: FRONTEND_URL
        sync: false          # Set to your frontend URL after deploy
      - key: UPLOAD_DIR
        value: uploads
      - key: ENVIRONMENT
        value: production
      - key: RESEND_API_KEY
        sync: false          # Set in Render dashboard (e.g. re_...)
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      - key: SMTP_HOST
        sync: false          # Set in Render dashboard (e.g. smtp.gmail.com)
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        sync: false          # Set in Render dashboard (e.g. your-email@gmail.com)
      - key: SMTP_PASSWORD
        sync: false          # Set in Render dashboard (e.g. Google App Password - 16 chars)
      - key: SMTP_FROM_EMAIL
        sync: false          # Set in Render dashboard (e.g. your-email@gmail.com)
      - key: SMTP_USE_TLS
        value: "true"
      - key: OTP_EXPIRE_MINUTES
        value: "5"

  # Frontend (Static Site)
  - type: web
    name: quizforge-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        sync: false          # Set to your backend URL after deploy

databases:
  - name: quizforge-db
    plan: free
    databaseName: quizforge_db
    user: quizforge
